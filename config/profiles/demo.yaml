# config/profiles/demo.yaml - the demo-day profile: `sit-review run <pdf> --profile demo`.
# Deep-merged over config/agent.yaml and config/stop_rules.yaml (config/profiles/README.md); the
# pinned lines of those files are unchanged. Decided by the coordinator on 2026-10-02 (owner-delegated).
#
# MEASURED: on 2026-10-03, before the concurrent stage 1, assess was cut at its limit and the run said "not
# assessed" (docs/live_runs/demo_profile_measure_1/); on 2026-10-04 the six-shard design ended at 508.5 s
# (docs/live_runs/sit_sample_ui_2/). 540 s stays a configurable assumption: the brief sets no time limit
# (USER_DECISIONS #34), and a longer slot is one --deadline away. Still UNMEASURED: a second run at medium.
#
# Why not `high` (USER_DECISIONS #1 allows high but asks that spend be justified): at high the model
# calls alone took ~16 min in the measured run (understand 158 s, plan 158 s, assess ~520 s, verify
# 33 s, report 88 s; no research, refine skipped), three times the 9-minute slot. Medium is the model's
# own default on Opus 5.5; research only reads and summarises tool results, so it runs at low.
# Per-stage effort costs no prompt cache on the claude_code backend: every call forks a fresh CLI
# session and the shared prefix was re-written on every phase anyway (HANDOVER §8, "Cache"); on the
# anthropic_api backend each effort switch rewrites the cached prefix (ADR-002 Consequences).
agent:
  effort:
    plan: medium          # understand shares this level (states.EFFORT_KEY)
    research: low
    assess: medium
    refine: medium
    verify: medium
    report: medium

stop_rules:
  deadline_seconds: 540   # 9 minutes: one minute of margin in the 10-minute live run (runbook §5)
  # 540 s is a project ASSUMPTION (audit U4): the lab brief sets no live-run time limit; kept as a safety net until SIT answers (USER_DECISIONS #34).
  # Reserves (robustness LLM-05; see config/stop_rules.yaml), sized for the concurrent design (docs/design/
  # latency_and_demo_design.md section 5); the defaults (180 s and 600 s) are sized from `high`. UNMEASURED:
  report_reserve_seconds: 75    # verify (~5 s, code) + the verdict call (~52 s predicted at medium) + render
  refine_reserve_seconds: 200   # refine in revision form, ~175 s predicted at medium (renamed from
                                # assess_reserve_seconds 2026-10-03, latency redesign W0)
  # They match the stage limits below: stage_1_end = 540 - 75 - 200 = 265, refine_end = 540 - 75 = 465. The
  # runtime bounds each model call by its stage limit (llm/runtime.py, W1); a --deadline at or below 530 s
  # or above 540 s scales the three limits by deadline / (refine_end + report_reserve_seconds) = deadline / 540
  # and says so first (--deadline 300: 147 / 258 / 294 s; --deadline 900: 441 / 775 / 883 s).
  # stage_limits_s: design section 4, the run clock at 540 s. Absolute seconds, not a fraction of the
  # deadline (the thinking block per call is fixed, about 105 s per assess shard at medium), so this
  # profile sets its own three values; see config/stop_rules.yaml for the rule.
  stage_limits_s:
    stage_1_end: 265            # understand, plan, research and the six assess shards end by here
    refine_end: 465             # refine ends by here, else the merged findings ordered by severity stand
    verdict_end: 530            # the verdict call ends by here, else the rule-based verdict
