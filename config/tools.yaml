# config/tools.yaml - line numbers pinned by tests/test_config_layout.py
auth_env: SIT_MCP_API_KEY
auth_header: Authorization        # sent as "Bearer <key>"; probe 2026-10-03, all four servers
servers:
  - name: mcp-internet-search
    enabled: true
    allow_tools: ["*"]
  - name: mcp-research-information
    enabled: true
    allow_tools: ["*"]
  - name: mcp-browser-automation-pw
    enabled: false
    allow_tools: ["*"]
  - name: mcp-document-intelligence
    enabled: false
    allow_tools: []
url_policy: url_policy.yaml
# ---- Lines 1-17 are pinned (docs/DEMO_DAY_RUNBOOK.md §4.1). Free layout below this line. ----
# Browser stays off: the probe of 2026-10-03 shows ONE global browser session per server, not one
# per client, and no domain allowlist (fresh_eyes N15; research/robustness/mcp_probe_findings.md).
# Document intelligence stays off: the probe of 2026-10-03 reached it, but its one sample (plain
# text, no URI scheme) was rejected ("only file:// and https:// are accepted"), so a real https
# document has still never been read through it (ADR-006 item 4, not yet refuted).
connect_timeout_s: 150            # cold-start allowance for initialize (scale-to-zero containers)
call_timeout_s: 60
cold_start_retries: 1             # one retry on a cold-start-like failure (timeout, 502/503/504)
# Reopen an MCP session idle longer than this before the next call (0 = never). Run sit_sample_tools_1
# (docs/live_runs/sit_sample_tools_1/MEASUREMENT.md) held the warm-up session idle from 2 s to 132 s and
# every web search then failed "MCP error -32000: Connection closed"; the servers scale to zero and the
# probe of 2026-10-03 measured cold starts of 29 to 70 s against 0.04 s warm
# (research/robustness/mcp_probe_results.redacted.json), so a session idle for more than about a minute
# is treated as stale. The real idle timeout of the servers is not known.
session_idle_reopen_s: 60
capabilities:                     # capability -> server; tools are offered by capability (INF-12)
  search: mcp-internet-search
  scholarly: mcp-research-information
  browse: mcp-browser-automation-pw
