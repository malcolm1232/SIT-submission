# config/stop_rules.yaml - line numbers pinned by tests/test_config_layout.py
active: [sufficient_evidence, no_marginal_gain, budget_tool_calls, budget_tokens, deadline]
max_tool_calls: 30
max_research_iterations: 4
max_input_tokens: 4000000
deadline_seconds: 3600
no_marginal_gain_window: 2
min_independent_sources: 2
# ---- Lines 1-8 are pinned (docs/DEMO_DAY_RUNBOOK.md §4.1). Free layout below this line. ----
# Every rule in `active` must be registered in agent/sit_review_agent/stop_rules.py and reports one
# of the closed StopReasonCode values (spec/finding.schema.json, spec/taxonomy.yaml stop_reasons).
# deadline_seconds (line 6) is the default for every run without --deadline or a profile (dev and
# Tier A evaluation). eval/prereg.yaml and eval/EVAL_PLAN.md set no deadline for Tier A runs (the
# plan's 8-10 min estimate was withdrawn on 2026-10-03 for measured times). 3600 s because a high-effort run
# needs it: measured 2026-10-02 (docs/HANDOVER_FULL.md §8, Opus 5.5 high, claude_code, no research):
# understand 158 s + plan 158 s + assess ~520 s (one good attempt) + verify 33 s + report 88 s
# = ~16 min of model time; refine (unmeasured, re-emits every finding, likely ~5-9 min) and research
# (up to 4 iterations and 30 tool calls, ~10 min) bring a full run to ~35-40 min, and one retried
# assess-sized call adds ~9 min. 60 min covers that with ~25 % margin and still bounds a stuck run
# (llm.timeout_s 1800 x 5 attempts would otherwise be 2.5 h). The demo runs at 900 s through
# config/profiles/demo.yaml, not this default.
report_reserve_seconds: 180        # kept for verify + report: the deadline rule fires this long before the
                                   # deadline, and every model attempt before verify ends by then (LLM-05).
                                   # Measured at high: verify 33 s + report 88 s = ~2 min, plus ~1 min margin
refine_reserve_seconds: 600        # stage 1 (research and the assess shards) ends this long before the report
                                   # reserve, so refine keeps its time (research absorbs the squeeze; LLM-05).
                                   # Renamed from assess_reserve_seconds on 2026-10-03 (latency redesign); the
                                   # old key is refused, not mapped. Each model call is bounded by
                                   # stage_limits_s; this reserve still bounds research. 600 s: one assess attempt at
                                   # high took ~520 s (HANDOVER §8)
# stage_limits_s: the run-clock second by which each stage of the concurrent design must have ended
# (design 2026-10-03 section 4; readers: W1 llm/runtime.py, W2 orchestrator.py). They are absolute
# seconds, not a fraction of the deadline, because the thinking block of a model call is a fixed cost
# (about 105 s per assess shard at medium, whatever the deadline), so a fraction would silently move
# the limits when --deadline changes; a profile that changes the deadline sets its own three values.
# A --deadline other than refine_end + report_reserve_seconds scales all three by that ratio, down or up, announced.
# Each profile's limits must increase and all lie below its deadline_seconds; a profile without the
# block inherits these. These defaults keep the demo shape at 3600 s with the reserves above:
# stage_1_end = 3600 - 180 - 600, refine_end = 3600 - 180, verdict_end = 3600 - 60 (render and invariants).
stage_limits_s:
  stage_1_end: 2820                # understand, plan, research and every assess shard end by here
  refine_end: 3420                 # the refine call ends by here, else the merged findings stand (disclosed)
  verdict_end: 3540                # the verdict call ends by here, else the rule-based verdict
max_output_tokens: null            # optional cap on summed output tokens (null = none)
