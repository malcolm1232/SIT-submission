# config/agent.yaml - line numbers pinned by tests/test_config_layout.py
model: claude-opus-5-5
effort:
  plan: high
  research: high
  assess: high
  refine: high
  verify: high
  report: high
max_tokens: 128000
allow_fallback: false
persona: generalist_architect
# ---- Lines 1-12 are pinned (docs/DEMO_DAY_RUNBOOK.md §4.1). Free layout below this line. ----
# Effort: USER_DECISIONS 2026-10-02 #1 sets `high` for every agent phase (one effort level per
# conversation, ADR-002); `understand` shares the `plan` level. max_tokens applies to every stage.
# max_tokens is 128000 since 2026-10-03 (was 64000): the model's output maximum, raised because the
# measured assess call used 63,392 of 64,000 (docs/HANDOVER_FULL.md §8). It is also the largest value
# config.py accepts and the cap of the truncation retry, so a truncated answer now gets its one retry
# at the same cap (phases/_model_calls.py). How each backend applies it:
#   anthropic_api: sent as `max_tokens` on every request (tests/test_anthropic_gateway.py). UNVERIFIED live.
#   claude_code:   passed as CLAUDE_CODE_MAX_OUTPUT_TOKENS in the child environment. Checked 2026-10-03 with
#                  Claude Code 2.1.287 on Haiku, two calls: a cap of 256 was enforced (the CLI answered
#                  "exceeded the 256 output token maximum"), and a cap of 128000 was accepted. NOT verified:
#                  that Opus 5.5 through the CLI can actually emit more than 64,000 tokens in one call (no Opus
#                  call was made; the CLI may clamp the value per model). When the cap is hit the CLI first
#                  makes its own recovery turns (4 turns seen), each billed, then reports an error, which the
#                  gateway types as a truncation (LLMTruncatedError, never retried at the gateway).
thinking_display: omitted          # omitted | summarized (thinking is always adaptive on Opus 5.5)

llm:
  timeout_s: 1800                  # per attempt, and never past the run deadline minus the verify + report reserve
                                   # (stop_rules.yaml report_reserve_seconds; robustness LLM-05). Measured
                                   # 2026-10-02: assess on Opus high via claude_code took ~520 s and 63k output
                                   # tokens; 600 s timed out 4 times (docs/HANDOVER_FULL.md §8)
  max_retries: 4                   # owned by LLMGateway; the SDK client always runs with max_retries=0
  backoff_base_s: 2.0
  backoff_max_s: 60.0
  refusal_retries: 1               # one retry with professional-review framing (robustness LLM-06)
  first_call_network_window_s: 10  # connection errors on the first model call of a run: retried only this long,
                                   # then exit 3 "no network" (robustness NET-02); later calls keep max_retries
  context_window_tokens: null      # pre-send size check against 80 % of this (LLM-10); null = the model's known
                                   # window (1M for every supported model) or models.retrieve's max_input_tokens
  backend: claude_code   # claude_code (Claude subscription / cloud credits via headless Claude Code, ADR-010) | anthropic_api (ANTHROPIC_API_KEY)

claude_code:                       # used only when llm.backend is claude_code
  executable: claude               # Claude Code CLI on PATH (check with `claude --version`)
  extra_args: []                   # appended to every `claude -p` call; --bare and --no-session-persistence are rejected
  max_budget_usd_per_call: null    # number: passed as --max-budget-usd (client-side estimate); null = no cap
  inherit_api_key: false           # false: strip ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN so claude -p bills the subscription / cloud credits

phases:                            # only research and refine may be disabled
  ingest: true
  understand: true
  plan: true
  research: true
  assess: true
  refine: true
  verify: true
  report: true

transport: live                    # live | record | replay | fake
replay:
  fixtures: null                   # cassette directory for transport=replay
  strict: true                     # strict: a miss raises ReplayMiss; lenient: empty result
record:
  cassette_dir: tests/fixtures/cassettes
fault_schedule: null               # path to a robustness fault schedule YAML, or null

run_root: runs
plan_approval: false               # true: print the plan and wait for approval before research
report:
  min_severity: low                # findings below this severity are listed only in the appendix
  template: standard               # standard | risk_register

files:                             # relative to this file's directory
  stop_rules: stop_rules.yaml
  tools: tools.yaml
  criteria: criteria.yaml
  endpoints: endpoints.yaml
  url_policy: url_policy.yaml
  persona: persona.yaml
