     "tiktok.com", "pinterest.com", "slideshare.net", "scribd.com", "towardsdatascience.com"]
  docs_prefixes:  # host prefixes that mark official documentation -> primary_official
    ["docs.", "developer.", "developers.", "learn.", "spec.", "specs.", "documentation."]
