<body>
<!-- DBSearch's app grid (docs/design/ui_restyle.md): a dark rail, a topbar of pills, the surface. -->
<div class="app" id="app-grid">
  <nav class="navrail" id="navrail" aria-label="Primary"><div class="navrail-inner">
    <a class="navrail-brand" href="/"><span class="word">SIT review</span><span class="ai">.</span></a>
    <div class="navrail-group">Workspace</div>
    <a class="navrail-item" data-page="review" href="/"><svg class="navrail-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h6l3 3v8H4z"/><path d="m6.5 9 1.5 1.5 3-3"/></svg><span class="label">Review</span></a>
    <a class="navrail-item" data-page="runs" href="/?page=runs"><svg class="navrail-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg><span class="label">Runs</span></a>

    <div class="navrail-group">Operate</div>
    <a class="navrail-item" data-page="tools" href="/?page=tools"><svg class="navrail-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5v4M10 2.5v4"/><path d="M4 6.5h8v2a4 4 0 0 1-8 0z"/><path d="M8 12.5v2"/></svg><span class="label">Tools</span></a>
    <a class="navrail-item" data-page="settings" href="/?page=settings"><svg class="navrail-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h11M2.5 11h11"/><circle cx="6" cy="5" r="1.6"/><circle cx="10" cy="11" r="1.6"/></svg><span class="label">Settings</span></a>

    <!-- the surface slot (rail.css .navrail-slot): the runs and the tool servers, every value from the server's JSON -->
    <div class="navrail-slot" id="navrail-slot">
      <div class="rail-head"><span>Runs</span><span id="rail-runs-note"></span></div>

  </div></nav>
  <header class="topbar">

    <span class="spacer"></span>

<!-- The Review page: DBSearch's empty state, the drop zone, the sample-document chips and the start form. One primary action (craft 4.5, 5.1). -->
<template id="tpl-drop">
  <div class="empty">
    <h1>Review a design document</h1>
    <p>Concurrent shards, one per group of criteria, assess it, each quote is checked against the page text, and a ranked verdict follows.<br>The agent reads the document only once it is ingested and hashed; nothing on this page is estimated.</p>
  </div>
  <form id="start-form">
    <div class="dropzone" id="dropzone">
      <svg class="ico" viewBox="0 0 24 24" style="width:20px;height:20px;color:var(--fg-muted)" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/></svg>
      <div class="big" style="margin-top:10px">Drop the design document here</div>
      <div class="muted small" style="margin-top:4px">PDF, or a page-marked .txt or Markdown file.</div>
      <div class="chosen" id="doc-chosen" hidden></div>
      <div style="margin-top:14px"><label class="btn" for="doc-input">Choose file</label>
        <input type="file" id="doc-input" name="document" accept=".pdf,.txt,.md" hidden></div>
      <div class="link-row"><input class="input" id="doc-link" type="url" autocomplete="off" spellcheck="false" placeholder="or paste a link to a PDF (https only)" aria-label="Link to a PDF"></div>
      <div class="micro muted" id="link-help">A pasted link is fetched by this server when the review starts: public hosts only, under config/url_policy.yaml, at most <span id="link-max"></span> MB, saved with the run's inputs.</div>
      <div class="micro error" id="link-error" hidden>Paste one https link to a PDF; other schemes are not fetched.</div>
    </div>
    <div class="starters" id="starters"><span class="lead">or a sample document from config/ui.yaml:</span></div>
    <div class="form">
      <div class="field">
        <span class="label">Previous version (optional)</span>
        <div class="picker"><label class="btn" for="prev-input">Choose file</label><span class="muted small" id="prev-chosen">No file chosen</span>
          <input type="file" id="prev-input" name="previous" accept=".pdf,.txt,.md" hidden></div>
        <div class="help">Given, the run is a delta re-assessment of the document above against this earlier version (<span class="mono">--v1</span>): every prior finding is marked resolved, partially addressed, still open or new in update.</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="profile-select">Profile</label>
          <select class="select" id="profile-select" name="profile"></select>
          <div class="help num" id="profile-help"></div>
        </div>
        <div class="field">
          <label for="deadline-min">Deadline (minutes)</label>
          <input class="input num" id="deadline-min" name="deadline_min" type="number" step="0.5" inputmode="decimal" autocomplete="off">
          <div class="help" id="deadline-help"></div>
        </div>
        <div class="field">
          <span class="label">Tools</span>
          <label class="check"><input type="checkbox" id="no-tools" name="no_tools" value="1"><span>Document only (<span class="mono">--no-tools</span>)</span></label>
          <div class="key-warn" id="key-warn" role="alert" hidden></div>
          <div class="help" id="tools-help"></div>
        </div>
        <div class="field">
          <label for="run-id">Run ID (optional)</label>
          <input class="input" id="run-id" name="run_id" autocomplete="off" spellcheck="false" placeholder="ui-<date>-<time>-<hex>">
          <div class="help">Name of the run directory (<span class="mono">--run-id</span>): letters, digits, dot, dash and underscore. Left empty, the server names it by the start time.</div>
        </div>
      </div>
      <div class="start-row">
        <button class="btn primary" type="submit" id="start-btn" disabled>Start review</button>
        <span class="micro muted" id="start-note">Enabled once a document is chosen or a link is pasted. The page runs the command below as a subprocess, the same as typing it.</span>
      </div>
      <div class="cmd" id="cmd-preview"></div>
      <div class="error" id="start-error" hidden></div>
    </div>
  </form>
</template>

<!-- The run: a serif head with the run clock, tracks with elapsed time against the stage limit, drafts labelled unverified, the status feed (craft 4.4). -->
<template id="tpl-run">
  <div class="surface-head" id="run-head">
    <div><div class="surface-title" id="top-doc"></div><div class="surface-sub num" id="top-sub"></div></div>
    <div class="head-right"><div class="clock num" id="top-meta"></div><div class="stop" id="top-action"></div></div>
  </div>
  <div class="tabrow" id="run-tabrow" hidden><span class="tabs" id="top-tabs"></span></div>
  <div class="finished-bar" id="finished-bar" hidden></div>
  <!-- the whole run on one axis: the recorded stage limits and the deadline as markers, the cursor at the live clock -->
  <div class="axis" id="run-axis" hidden>
    <div class="axis-head"><h2>The run against its limits</h2><span class="limit num" id="axis-note"></span><button class="why-btn" type="button" id="axis-why" data-why="limits" aria-expanded="false">Why</button></div>
    <div class="axis-line" id="axis-line"></div>
    <div class="axis-labels" id="axis-labels"></div>
    <div id="axis-why-text"></div>
  </div>
  <div id="limit-notes"></div>
  <div class="run-wrap">
    <div class="stages">
      <!-- explanation, never the record: the entry of the current stage from #explain-map, numbers from the stream -->
      <section class="explain" id="explain" aria-labelledby="explain-title">
        <div class="explain-head"><h2 id="explain-title">What is happening</h2><span class="pill explain-pill" id="explain-label">explanation, not the record</span></div>
        <div id="explain-body"></div>
        <div class="explain-rule">Written in advance for each stage from the architecture and the code; only the numbers are this run's, read from its event stream. Each row's Why opens the same text for that stage.</div>
      </section>
      <div class="stage-head"><h2>Stage 1, concurrent</h2><span class="limit num" id="stage1-limit"></span></div>
      <div class="tracks" id="stage1-tracks"></div>
      <div id="stage1-disclosures"></div>
      <div class="stage-head"><h2>Then, in order</h2><span class="limit">each waits for the stage before it; a cut keeps what was finished and says so in the report</span></div>
      <!-- the findings funnel: every merged draft followed to its fate, from GET /runs/<id>/funnel (ui/stages.py) -->
      <section class="funnel" id="funnel" aria-label="The findings, from drafts to the report" hidden></section>
      <div class="tracks" id="seq-tracks"></div>
      <div class="notice" id="stop-rule" hidden></div>
      <div class="legend" id="legend">The bar is elapsed time against the stage limit on the run clock, nothing else. It is not an estimate of completion. Event times are the record's own run clock; the head clock and the axis cursor add only the seconds since the last event arrived, counted on this browser's clock, and the limit markers are the run's recorded limits. A track that hits its limit shows <span class="pill cut">cut</span> with the time, and what it kept as a disclosure line under its stage. A run served by <span class="mono">dra replay</span> carries <span class="pill replayed">replayed evidence</span> in the head. A row's name opens what that stage produced, read from the files the run wrote, in the panel beside the rows; a chip there opens what it means.</div>
    </div>
    <div class="feed" id="feed">
      <h2>Draft findings <span class="muted num" style="font-weight:400" id="draft-count"></span> <button class="pill draft chip" type="button" data-term="run-draft" aria-expanded="false">draft, unverified</button></h2>
      <div class="rule">Each line appears as its JSON object completes in a shard's stream. None has been through refine or verify; IDs, ranks and severities can change, and a draft can be withdrawn.</div>
      <div id="drafts"></div>
      <div class="log">
        <h2>Status <span class="muted" style="font-weight:400">same lines as the terminal and progress.log</span></h2>
        <div class="rule">A status line at least every 10 s while any call is open. Newest first.</div>
        <div class="rows" id="status-feed"></div>
      </div>
    </div>
    <!-- one stage at a time: what it produced, from GET /runs/<id>/stage/<name>; it takes the Draft findings column's
         place, so opening a stage never moves the stage rows -->
    <aside class="stage-panel" id="stage-panel" aria-labelledby="sp-title" hidden>
      <div class="sp-head">
        <div class="sp-headtext"><div class="sp-kicker" id="sp-kicker">What this stage produced</div><h2 id="sp-title" tabindex="-1"></h2></div>
        <button class="btn quiet sp-close" type="button" id="sp-close">Close</button>
      </div>
      <div class="sp-body" id="sp-body"><div id="sp-calls"></div><div id="sp-content"></div></div>
    </aside>
  </div>
</template>

<!-- The Architectural design view (architecture.js): the diagram, and beside it the guide or one topic's panel with its
     Simple and Advanced tabs; the panel is the run page's stage panel, so opening a topic never moves the diagram. -->
<template id="tpl-architecture">
  <div class="surface-head">
    <div><div class="surface-title">Architectural design</div><div class="surface-sub" id="arch-sub"></div></div>
    <div class="head-right" id="arch-run"></div>
  </div>
  <div class="arch-wrap" id="arch-wrap">
    <div class="arch-diagram" id="arch-diagram"></div>
    <div class="arch-guide" id="arch-guide"></div>
    <aside class="stage-panel arch-panel" id="arch-panel" aria-labelledby="ap-title" hidden>
      <div class="sp-head">
        <div class="sp-headtext"><div class="sp-kicker" id="ap-kicker"></div><h2 id="ap-title" tabindex="-1"></h2></div>
        <button class="btn quiet sp-close" type="button" id="ap-close">Close</button>
      </div>
      <div class="tabs arch-tabs" id="ap-tabs" role="tablist" aria-label="Detail"></div>
      <div class="sp-body"><div id="ap-content" role="tabpanel"></div></div>
      <div class="arch-nav" id="ap-nav"></div>
    </aside>
  </div>
</template>

<!-- The finished review: verdict first, the three outputs as quiet pills in the head, the tabs, and the ask composer at the foot as a reading aid kept apart from the review. -->
<template id="tpl-review">
  <div class="surface-head">
    <div><div class="surface-title" id="top-doc"></div><div class="surface-sub num" id="top-sub"></div></div>
    <section class="head-actions" id="outputs" aria-label="Take the review with you" hidden>
      <div class="out"><h3 class="sr-only">Download</h3><a class="btn quiet" id="out-download" download><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M5 7.5l3 3 3-3"/><path d="M3 13.5h10"/></svg><span id="out-download-label">Download review (zip)</span></a></div>
      <div class="out"><h3 class="sr-only">Email</h3><button class="btn quiet" type="button" id="email-btn" aria-expanded="false" aria-controls="email-box"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11v8h-11z"/><path d="m2.5 4.5 5.5 4 5.5-4"/></svg>Email the review</button></div>
      <div class="out"><h3 class="sr-only">Share</h3><button class="btn quiet" type="button" id="share-btn" aria-expanded="false" aria-controls="share-box"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5 8.5 3a2.5 2.5 0 0 1 3.5 3.5L10.5 8"/><path d="M9 11.5 7.5 13A2.5 2.5 0 0 1 4 9.5L5.5 8"/></svg>Share link</button></div>
    </section>
  </div>
  <div class="tabrow"><span class="tabs" id="top-tabs"></span><span class="micro muted" id="tab-note"></span></div>
  <div class="out-line" id="out-line" hidden><span id="out-download-help"></span><a id="out-open" target="_blank" rel="noopener">Open it in a new tab</a><a id="out-md" download>report.md</a><a id="out-json" download>report.json</a></div>
  <div class="outline" id="email-box" hidden>
    <form class="row" id="email-form" novalidate>
      <input class="input" id="email-to" type="email" autocomplete="email" spellcheck="false" placeholder="name@example.org" aria-label="Recipient address">
      <button class="btn" type="submit" id="email-send" disabled>Email the review</button>
    </form>
    <div class="help" style="margin-top:8px"><span id="email-help"></span> <span id="email-result" hidden></span></div>
  </div>
  <div class="outline" id="share-box" hidden>
    <div id="share-text"></div>
    <div class="cmd" id="share-line"></div>
  </div>
  <div id="review"></div>
  <section class="ask" id="chat" aria-label="Ask the review">
    <div class="head"><h2>Ask the review</h2><span class="pill" id="chat-label">reading aid, not the review</span></div>
    <div class="notice">Answers come only from this run directory: report.json, the evidence entries its findings cite and the coverage outcomes. The model may quote and cite, never add a finding, change one, or re-run the review. If the review does not answer a question, it says so and nothing more.</div>
    <div id="chat-turns"></div>
    <form class="composer-shell" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Ask about a finding, an objective, a page or an evidence ID" aria-label="Question"></textarea>
      <span class="ready" id="chat-ready">Grounded in this review</span>
      <button class="ask-btn" type="submit" id="chat-send">Ask</button>
    </form>
    <div class="composer-hint"><span>Enter to ask · Shift + Enter for a new line</span><span class="trust" id="chat-hint"></span></div>
    <div class="error" id="chat-error" hidden></div>
    <div class="budget num" id="chat-budget"></div>
  </section>
</template>

<!-- The "What is happening" panel's text (USER_DECISIONS #45): one entry per stage, written in advance from
     docs/ARCHITECTURE.md sections 2, 3, 5 and 6 and the code each "src" names. It is explanation, never the record:
     a {name} is filled by app.js FACTS from the run's own event stream, and a sentence whose names are not all in
     the stream yet is replaced by its "else" or left out, so no empty number is ever shown.
     tests/test_ui_explain.py checks every name against FACTS, every decision number against
     docs/USER_DECISIONS.md and every file against the repository. -->
<script type="application/json" id="explain-map">
{
  "ingest": {
    "title": "Ingest: reading the PDF",
    "says": [
      {"text": "Ingest is code, not a model: the PDF is read into page-marked text of {pages} pages and {sections} sections, and every later quote is checked against these same bytes.",
       "else": "Ingest is code, not a model: the PDF is read into page-marked text, and every later quote is checked against these same bytes."}
    ],
    "src": "agent/sit_review_agent/phases/ingest.py; agent/sit_review_agent/ingest/text.py"
  },
  "understand": {
    "title": "Understand: what the design says it is",
    "says": [
      "Understand is one model call that reads the whole document once and writes the intent summary (the design's objectives and constraints) and a registry of what the document has settled: its approved and pending decisions, constraints and key requirements.",
      "Each entry carries a verbatim quote as its anchor, and the registry is then frozen and hashed, so no later call can rewrite what the document decided: later findings link to these entries and quote the same page text, which is what makes every claim traceable.",
      {"text": "This run: {objectives} objectives, {constraints} constraints and {registry_entries} registry entries from {pages} pages.",
       "else": {"text": "The document is {pages} pages and {sections} sections; the counts appear here when the call returns."}}
    ],
    "src": "agent/sit_review_agent/phases/understand.py; agent/sit_review_agent/state/decision_registry.py; docs/ARCHITECTURE.md sections 2 and 6"
  },
  "plan": {
    "title": "Plan: what to check and what to look up",
    "says": [
      {"text": "Plan is one model call that turns the {criteria} review criteria into the questions to check, and marks the ones that need an outside source as research questions for the SIT MCP servers.",
       "else": "Plan is one model call that turns the review criteria into the questions to check, and marks the ones that need an outside source as research questions for the SIT MCP servers."},
      "Code adds a document-only question for any criterion the model neither asked about nor skipped with a reason, so every criterion ends with a question or a stated reason to skip it; research starts once understand and plan have both ended, while the assess shards never wait for the plan.",
      {"text": "This run: {questions} questions, {external} of them for an outside source."}
    ],
    "src": "agent/sit_review_agent/phases/plan.py build_plan; agent/sit_review_agent/states.py STAGE_1_DEPENDS"
  },
  "assess": {
    "title": "Assess: the shards, side by side",
    "says": [
      {"text": "Assess is {shards} model calls running at the same time, one per group of criteria, each reading only the document and its own criteria: one pass over every criterion did not fit the slot, so the stage now takes as long as its slowest shard, not the sum of them.",
       "else": "Assess is one model call per group of criteria, all running at the same time, each reading only the document and its own criteria: one pass over every criterion did not fit the slot, so the stage takes as long as its slowest shard, not the sum of them."},
      {"text": "Each shard drafts findings anchored to verbatim quotes with a page; a shard that reaches the stage 1 limit at {stage_1_end} keeps every finding it had finished, and only its criteria with no finished finding are marked not assessed.",
       "else": "Each shard drafts findings anchored to verbatim quotes with a page; a shard that reaches the stage 1 limit keeps every finding it had finished, and only its criteria with no finished finding are marked not assessed."},
      {"text": "So far {shards_drafted} of {shards} shards have answered, {shards_cut} ended at the limit, and {drafts} draft findings have streamed."},
      {"text": "The merge, which is code, then numbered {merged_findings} findings in shard order, so no ID depends on which shard finished first."}
    ],
    "src": "agent/sit_review_agent/phases/assess.py; config/agent.yaml assess.shards; docs/ARCHITECTURE.md section 3; decisions #31 and #40"
  },
  "research": {
    "title": "Research: asking the SIT MCP servers",
    "says": [
      {"text": "Research asks the SIT MCP servers the plan's {research_questions} outside questions in rounds: the model asks for tool calls, the gateway runs them, and each successful result is recorded in the ledger (EV-nnn) before the model reads it, so it can cite only what it has read.",
       "else": "Research asks the SIT MCP servers the plan's outside questions in rounds: the model asks for tool calls, the gateway runs them, and each successful result is recorded in the ledger (EV-nnn) before the model reads it, so it can cite only what it has read."},
      {"text": "It has asked {servers} with {tool_calls} tool calls; after each round the stop rules decide whether another round is worth it.",
       "else": {"text": "{tools_offered} tools are offered from the enabled servers; after each round the stop rules decide whether another round is worth it.",
                "else": "After each round the stop rules decide whether another round is worth it."}},
      "The assess shards never see this evidence: they start at once, and waiting for research would not fit the slot, so refine applies it to the merged findings instead and the evidence is attached by the one call that has read it, never by a shard that did not (decision #37).",
      {"text": "Research did not run: this review is document only, with no tool server in use, so its {research_left} outside questions are left to the document and reported as validation needs.",
       "else": {"text": "Research stopped ({research_stop}) with {answered} of {research_questions} questions answered and {ledger_entries} entries in the ledger."}}
    ],
    "src": "agent/sit_review_agent/phases/research.py; agent/sit_review_agent/stop_rules.py; agent/sit_review_agent/state/evidence_ledger.py; decision #37"
  },
  "refine": {
    "title": "Refine: one call over every finding",
    "says": [
      {"text": "Refine is one model call over all {merged_findings} merged findings that sees the research evidence, the frozen registry and every shard's findings together, so it can merge duplicates across shards, withdraw the unsupported ones, rank them and attach the outside evidence.",
