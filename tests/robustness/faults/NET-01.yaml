# NET-01 (S1, P0, L0 + L1): network lost mid-run. Planning takes 200 s (virtual) and each server's
# first call 10 s; the network drops at 205 s for 120 s, in the middle of research's first tool
# round: the web search completes (10 s, started before the drop), the scholarly call that starts
# at 210 s fails as a network error, and the model call after the round fails after its retry
# budget. The run halts with exit 3 and a resumable checkpoint (plan). `sit-review resume <run_dir>`
# then completes: the completed web search is served from tools.jsonl, never repeated. The window
# is measured from each fault layer's start, so it does not recur on resume.
id: NET-01
description: Network unreachable from 205 s to 325 s, while research runs.
seed: 42
llm:
  - match: {stage: plan}
    fault: {type: latency, seconds: 200}
mcp:
  - match: {server: "*", call_index: 0}
    fault: {type: latency, seconds: 10}
network:
  - {type: offline, from_seconds: 205, duration_seconds: 120}
